<!DOCTYPE html>

<style>
:root{--ink:#0b2a4a;--nar:#c8102e;--flame:#ff9f1c;--cream:#fff3dc;--sea:#00b5e2;--bg:#07182b;--fg:#fff3dc;--glass:rgba(7,24,43,.55)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#020b16;color:var(--fg);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;background:var(--bg);overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.top{position:absolute;z-index:20;top:env(safe-area-inset-top,0px);left:0;right:0;padding:10px 14px 0}
.bar{display:flex;align-items:center;justify-content:space-between}
.logo{font-family:Unbounded,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:6px}
.logo i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5a6e,var(--nar) 60%);box-shadow:0 0 14px var(--nar);position:relative}
.logo i:after{content:"";position:absolute;top:-4px;left:6px;width:8px;height:5px;background:#509e2f;clip-path:polygon(0 100%,25% 0,50% 60%,75% 0,100% 100%)}
.tabs{display:flex;gap:16px;font-weight:700;font-size:15px}
.tabs button{background:none;border:0;color:var(--fg);opacity:.55;font:inherit;padding:4px 0;border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{opacity:1;border-color:var(--flame)}
.stories{display:flex;gap:12px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;text-align:center;font-size:11px;width:58px;cursor:pointer}
.ring{width:56px;height:56px;border-radius:50%;padding:3px;background:conic-gradient(var(--sea),#509e2f,var(--flame),var(--nar),var(--sea));display:grid;place-items:center}
.ring.seen{background:#4a5a6e}
.ring span{width:100%;height:100%;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-size:22px;border:2px solid var(--bg)}
.st b{display:block;margin-top:3px;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.post{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.post svg.scene{position:absolute;inset:0;width:100%;height:100%}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,24,43,.55) 0,transparent 28%,transparent 50%,rgba(7,24,43,.92) 100%)}
.info{position:absolute;left:14px;right:84px;bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.who{display:flex;align-items:center;gap:8px;font-weight:700}
.av{width:38px;height:38px;border-radius:50%;background:var(--ink);border:2px solid var(--cream);display:grid;place-items:center;font-size:18px}
.fol{margin-left:4px;border:1.5px solid var(--cream);background:none;color:var(--cream);border-radius:8px;padding:3px 10px;font:700 12px Manrope;cursor:pointer}
.fol.on{background:var(--cream);color:var(--ink)}
.cap{margin:8px 0 6px;font-size:14px;line-height:1.4}
.cap em{font-style:normal;color:var(--flame);font-weight:700}
.mus{font-size:12px;opacity:.9;display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap}
.mus span{display:inline-block;animation:mq 9s linear infinite}
@keyframes mq{from{transform:translateX(40%)}to{transform:translateX(-110%)}}
.side{position:absolute;right:10px;bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;align-items:center}
.side button{background:none;border:0;color:var(--fg);font:700 12px Manrope;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.side svg{width:34px;height:34px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));transition:transform .15s}
.side button:active svg{transform:scale(.8)}
.liked svg{fill:var(--nar);stroke:var(--nar)}
.saved svg{fill:var(--flame);stroke:var(--flame)}
.prog{position:absolute;left:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));height:3px;width:100%;background:rgba(255,243,220,.2)}

@keyframes pg{to{width:100%}}
.burst{position:absolute;pointer-events:none;font-size:80px;animation:bu .8s ease-out forwards;transform:translate(-50%,-50%)}

nav{position:absolute;z-index:30;bottom:0;left:0;right:0;height:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(7,24,43,.94);display:flex;align-items:center;justify-content:space-around;border-top:1px solid rgba(255,243,220,.1)}

nav button.on{opacity:1}
nav svg{width:24px;height:24px}
nav .plus{opacity:1;width:50px;height:34px;border-radius:12px;background:linear-gradient(90deg,var(--sea) 0 30%,var(--nar) 30% 100%);display:grid;place-items:center;box-shadow:0 0 18px rgba(200,16,46,.6)}
.sheet{position:absolute;z-index:40;left:0;right:0;bottom:0;max-height:72%;background:#0d2540;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet h3{font:800 15px Unbounded;text-align:center;margin-bottom:10px}
.cl{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px;padding-bottom:10px}
.c{display:flex;gap:10px;font-size:13.5px;line-height:1.35}.c b{display:block;font-size:12px;opacity:.7}
.row{display:flex;gap:8px}
.row input,.row textarea{flex:1;background:#14355a;border:1px solid rgba(255,243,220,.15);border-radius:12px;color:var(--fg);padding:10px 12px;font:500 14px Manrope;outline:none}
.row input:focus,.row textarea:focus{border-color:var(--flame)}
.btn{background:var(--nar);color:#fff;border:0;border-radius:12px;padding:0 16px;font:700 14px Manrope;cursor:pointer;min-height:42px}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.pick button{aspect-ratio:1;border-radius:12px;border:2px solid transparent;cursor:pointer;font-size:22px}
.pick button.on{border-color:var(--cream)}
.veil{position:absolute;inset:0;z-index:35;background:rgba(0,0,0,.5);display:none}.veil.on{display:block}
.toast{position:absolute;z-index:60;top:90px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--cream);color:var(--ink);padding:8px 16px;border-radius:20px;font-weight:700;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.fl{animation:fl 1.6s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes fl{from{transform:scaleY(.95)}to{transform:scaleY(1.06)}}
.tw{animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.3}to{opacity:1}}
.wv{animation:wv 4s ease-in-out infinite alternate}
@keyframes wv{to{transform:translateX(-30px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
button:focus-visible{outline:2px solid var(--flame);outline-offset:2px}

.lf{filter:drop-shadow(0 0 6px #ff9f1c);animation:fl 1.1s ease-in-out infinite alternate}
.post svg.scene{animation:kb 18s ease-in-out infinite alternate}

.emb{position:absolute;inset:0;pointer-events:none;overflow:hidden}

@keyframes sp{to{transform:rotate(360deg)}}
#spl{position:absolute;inset:0;z-index:100;background:radial-gradient(circle at 50% 62%,#7a1230,#07182b 70%);display:grid;place-items:center;text-align:center;transition:opacity .6s}
#spl .w{font:800 44px Unbounded,sans-serif;letter-spacing:-1px;margin-top:6px}

.ov{position:absolute;inset:0;z-index:70;background:#000;display:none}.ov.on{display:block}

.swh{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;align-items:center;gap:8px;font-weight:700;z-index:4}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips button{background:#14355a;border:0;color:var(--flame);border-radius:14px;padding:5px 11px;font:700 12px Manrope;cursor:pointer}

.sheet{max-height:80%}

#app{color:var(--fg)}

.liked svg{background:rgba(200,16,46,.4)!important}
.av{background:linear-gradient(var(--ink),var(--ink)) padding-box,conic-gradient(var(--sea),#509e2f,var(--flame),var(--nar),var(--sea)) border-box;border:2px solid transparent}
nav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ring{animation:hu 6s linear infinite}@keyframes hu{to{filter:hue-rotate(360deg)}}.ring.seen{animation:none}
.pl{position:absolute;top:50%;left:50%;font-size:70px;transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity .2s;text-shadow:0 4px 20px #000}

const FN=[['','Normal'],['bk','Bakı'],['xz','Xəzər'],['nr','Nar'],['bw','Qara-ağ'],['old','Köhnə']];
const SET=[['theme','Açıq tema','Gündüz görünüşü'],['lite','Yüngül rejim','Effektləri azalt'],['still','Hərəkəti azalt','Animasiyaları dayandır'],['priv','Şəxsi hesab','Yalnız izləyənlər görür'],['ntf','Bildirişlər','Bəyənmə və izləmə xəbərləri']];
const NF=[['Leyla','paylaşımını bəyəndi','2 dəq','❤️'],['Tural','səni izləməyə başladı','14 dəq','➕'],['Nigar','şərh yazdı: "Əla çəkilişdir!"','1 saat','💬'],['Elçin','səni hekayədə qeyd etdi','3 saat','🔥'],['Aysel','paylaşımını saxladı','dünən','🔖']];
const FR=['Leyla','Tural','Nigar','Elçin','Aysel','Rəşad','Günel','Kamran'];
let ST={theme:0,lite:0,still:0,priv:0,ntf:1},PR={name:'Sən',bio:'Odlar yurdundan salam 🔥',em:'🔥'};
try{const d=JSON.parse(localStorage.getItem('odlar_set')||'null');if(d){Object.assign(ST,d.ST);Object.assign(PR,d.PR)}}catch(e){}
function sv2(){try{localStorage.setItem('odlar_set',JSON.stringify({ST,PR}))}catch(e){}}
function app(){const a=$('#app');a.classList.toggle('light',!!ST.theme);a.classList.toggle('lite',!!ST.lite);a.classList.toggle('still',!!ST.still);$('#bdg').style.display=ST.ntf&&!seenN?'block':'none'}
document.querySelector('.top .bar').lastElementChild.outerHTML='<div class="ta"><button id="bl" aria-label="Fəaliyyət">🔔<span class="bdg" id="bdg">5</span></button><button id="sd" aria-label="Səs">🔇</button></div>';
function note(f){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+1.6);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+1.7)}
const HJ=[293.7,311.1,369.99,392,440,466.2,587.3];
function tune(){clearInterval(sq);if(!snd||!AC)return;sq=setInterval(()=>{wi=Math.max(0,Math.min(6,wi+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));note(HJ[wi])},420+CUR*70)}
$('#sd').onclick=()=>{snd=!snd;if(snd&&!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC&&AC.state==='suspended')AC.resume();$('#sd').textContent=snd?'🔊':'🔇';tune();toast(snd?'Səs açıq: muğam ruhu 🎶':'Səs bağlı')};
let sT;$('#feed').addEventListener('scroll',()=>{clearTimeout(sT);sT=setTimeout(()=>{const f=$('#feed');CUR=Math.round(f.scrollTop/f.clientHeight);tune()},150)});
function enh(d){const l=d.querySelector('.lk'),i=+l.dataset.i,p=P[i],sv=d.querySelector('svg.scene'),r=sv.querySelector('rect'),R=Math.random;
 let g='';for(let j=0;j<34;j++)g+=`<circle class="tw" cx="${R()*400}" cy="${R()*320}" r="${.6+R()*1.4}" fill="#fff" style="animation-delay:-${R()*3}s;animation-duration:${1.5+R()*2}s"/>`;
 for(let j=0;j<3;j++)g+=`<ellipse class="wv" cx="${R()*400}" cy="${60+R()*200}" rx="${50+R()*50}" ry="${8+R()*8}" fill="#fff" opacity=".12" style="animation-duration:${8+R()*8}s"/>`;
 r.insertAdjacentHTML('afterend','<g>'+g+'</g>');
 sv.insertAdjacentHTML('beforeend',`<g class="bd" style="animation-delay:-${R()*10}s"><path d="M0 0q6-8 12 0q6-8 12 0" fill="none" stroke="#0b2a4a" stroke-width="2" opacity=".7" transform="translate(0 ${120+R()*150})"/></g>`);
 if(p.fl)sv.style.filter=FL[p.fl];
 const inf=d.querySelector('.info');['leak','fx'].forEach(c=>d.insertBefore(Object.assign(document.createElement('div'),{className:c}),inf));
 d.insertAdjacentHTML('beforeend','<div class="pl">▶</div>');
 d.querySelector('.disc').insertAdjacentHTML('beforebegin',`<button class="mr" data-i="${i}" aria-label="Daha çox"><svg viewBox="0 0 24 24" fill="#fff3dc"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><b>Daha</b></button>`);
 let l2=0;d.addEventListener('touchend',()=>{const n=Date.now();if(n-l2<300){clearTimeout(ct);dt=n}l2=n})}
const _d=decor;decor=function(){const L=[...document.querySelectorAll('.post')].filter(d=>!d.querySelector('.emb')&&d.querySelector('.side'));_d();L.forEach(enh)};
$('#feed').addEventListener('click',e=>{if(e.target.closest('button,.cap em,.info'))return;const d=e.target.closest('.post');if(!d||Date.now()-dt<600)return;clearTimeout(ct);ct=setTimeout(()=>d.classList.toggle('pz'),260)});
$('#feed').addEventListener('dblclick',()=>clearTimeout(ct));
$('#feed').addEventListener('click',e=>{const m=e.target.closest('.cap em');if(m){$('#disc').click();$('#dq').value=m.textContent;disc(m.textContent)}});
$('#feed').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.i===undefined)return;if(b.classList.contains('sh')){e.stopPropagation();shr(+b.dataset.i)}else if(b.classList.contains('mr')){e.stopPropagation();mnu(+b.dataset.i)}},true);
goTo=function(i){closeAll();document.querySelector('.tabs button').click();setTimeout(()=>{const f=$('#feed');f.scrollTo({top:P.slice(0,i).filter(p=>!p.hid).length*f.clientHeight,behavior:'smooth'})},60)};
function cp(){navigator.clipboard&&navigator.clipboard.writeText(location.href).catch(()=>{});toast('Link kopyalandı')}
function shr(i){sp=P[i];$('#shb').innerHTML=`<div class="gr" style="grid-template-columns:repeat(4,1fr);gap:12px">${FR.map(n=>`<button class="fr" data-n="${n}"><div class="av" style="width:52px;height:52px;font-size:20px;margin:auto;display:grid;place-items:center">${n[0]}</div><span>${n}</span></button>`).join('')}</div><div class="chips" style="margin-top:14px"><button data-a="cp">🔗 Linki kopyala</button><button data-a="st">➕ Hekayəyə əlavə et</button><button data-a="dl">⬇ Yüklə</button><button data-a="ns">📤 Daha çox</button></div>`;openSh('#shp')}
$('#shb').onclick=e=>{const f=e.target.closest('.fr');if(f){const c=MS.find(c=>c.n===f.dataset.n);if(c)c.m.push(['me','📎 @'+sp.u+': '+sp.cap.slice(0,40)]);f.querySelector('span').textContent='Göndərildi ✓';return}const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a==='cp')cp();else if(a==='st')toast('Hekayənə əlavə olundu 🔥');else if(a==='dl')toast('Yüklənir… ⬇');else if(navigator.share)navigator.share({title:'Odlar',text:sp.cap,url:location.href}).catch(()=>{});else cp()};
function mnu(i){mp=i;$('#mnb').innerHTML=[['ni','🙈','Maraqlı deyil'],['cp','🔗','Linki kopyala'],['dl','⬇','Videonu yüklə'],['rp','🚩','Şikayət et'],['bl','⛔','@'+P[i].u+' hesabını blokla']].map(m=>`<div class="c" data-a="${m[0]}" style="cursor:pointer;align-items:center;font-size:15px"><span style="font-size:20px">${m[1]}</span>${esc(m[2])}</div>`).join('');openSh('#mnu')}
$('#mnb').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const p=P[mp],a=b.dataset.a;closeAll();if(a==='ni'){p.hid=1;render();toast('Belə paylaşımlar az göstəriləcək')}else if(a==='bl'){P.forEach(q=>{if(q.u===p.u)q.hid=1});render();toast('@'+p.u+' bloklandı')}else if(a==='rp')toast('Şikayət göndərildi. Təşəkkürlər');else if(a==='dl')toast('Yüklənir… ⬇');else cp()};
$('#bl').onclick=()=>{seenN=1;app();$('#ntb').innerHTML=NF.map(n=>`<div class="c" style="align-items:center"><div class="tile" style="width:40px;height:40px;border-radius:50%;background:#14355a">${n[3]}</div><div><b style="opacity:1;font-size:13.5px">${n[0]}</b>${esc(n[1])}<span style="opacity:.55"> · ${n[2]}</span></div></div>`).join('');openSh('#ntp')};
function stg(){$('#stb').innerHTML=SET.map(([k,t,d])=>`<div class="c" style="align-items:center;justify-content:space-between"><div><b style="opacity:1;font-size:14px">${t}</b>${d}</div><button class="tg ${ST[k]?'on':''}" data-s="${k}" aria-label="${t}"></button></div>`).join('')+'<button class="btn" id="clr" style="background:#4a5a6e">Yaddaşı təmizlə</button>';openSh('#stg')}
$('#stb').onclick=e=>{const t=e.target.closest('.tg');if(t){ST[t.dataset.s]=ST[t.dataset.s]?0:1;t.classList.toggle('on');sv2();app();return}if(e.target.id==='clr'){try{localStorage.clear()}catch(x){}location.reload()}};
function prof(){const own=P.filter(p=>p.u==='sen');$('#pn').textContent='@sen';
 if(pe){$('#pb').innerHTML=`<div class="row"><input id="en" value="${esc(PR.name)}" maxlength="24" placeholder="Ad"></div><div class="row"><input id="eb" value="${esc(PR.bio)}" maxlength="60" placeholder="Bio"></div><div class="chips" id="ee">${['🔥','🍎','🏔️','🌊','🎨','☕','🧶','🦅'].map(m=>`<button data-a="em" data-e="${m}" class="${m===PR.em?'on2':''}">${m}</button>`).join('')}</div><button class="btn" data-a="sv">Yadda saxla</button>`;return openSh('#prs')}
 const L=P.map((p,i)=>[p,i]).filter(([p])=>pt==0?p.u==='sen':pt==1?p.sv:p.lk);
 $('#pb').innerHTML=`<div style="text-align:center"><div class="av" style="width:76px;height:76px;font-size:36px;margin:0 auto 6px;display:grid;place-items:center">${PR.em}</div><b>${esc(PR.name)}</b><div style="font-size:13px;opacity:.75;margin-top:2px">${esc(PR.bio)}</div></div><div class="stats"><div><b>${own.length}</b><span>Paylaşım</span></div><div><b>${1204+own.length*41}</b><span>İzləyici</span></div><div><b>${P.filter(p=>p.f).length}</b><span>İzlədiyin</span></div></div><div class="row"><button class="btn" style="flex:1" data-a="ed">Profili redaktə et</button><button class="btn" style="background:#14355a" data-a="st">⚙ Ayarlar</button></div><div class="stories" style="padding:12px 0 4px">${[0,1,2,4].map(j=>`<div class="st" data-a="hl" data-j="${j}"><div class="ring"><span>${SY[j][1]}</span></div><b>${SY[j][0]}</b></div>`).join('')}</div><div class="chips">${['Paylaşımlar','Saxlanılan','Bəyənilən'].map((t,j)=>`<button data-a="pt" data-j="${j}" class="${j==pt?'on2':''}">${t}</button>`).join('')}</div>`+(L.length?`<div class="gr">${L.map(([p,i])=>`<div class="tile" data-g="${i}" style="background:linear-gradient(${SC[p.s].g.join(',')})">${SC[p.s].e}</div>`).join('')}</div>`:'<p style="text-align:center;opacity:.7;padding:16px 0">Burada hələ heç nə yoxdur.</p>');openSh('#prs')}
$('#pb').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='ed'){pe=1;prof()}else if(a==='em'){PR.em=b.dataset.e;[...$('#ee').children].forEach(x=>x.classList.toggle('on2',x===b))}
 else if(a==='sv'){PR.name=$('#en').value.trim()||'Sən';PR.bio=$('#eb').value.trim();sv2();pe=0;prof();toast('Profil yeniləndi')}
 else if(a==='pt'){pt=+b.dataset.j;prof()}else if(a==='st')stg();else if(a==='hl'){closeAll();si=+b.dataset.j;$('#sw').classList.add('on');showS()}};
$('#me').onclick=()=>{pe=0;prof()};
$('#mb').insertAdjacentHTML('beforebegin','<div class="chips" id="cfl">'+FN.map(([k,n],j)=>`<button data-f="${k}" class="${j?'':'on2'}">${n}</button>`).join('')+'</div><div class="chips" id="cmu">'+['Tar','Kamança','Balaban','Muğam','Qaval'].map((n,j)=>`<button data-m="${n}" class="${j?'':'on2'}">♪ ${n}</button>`).join('')+'</div>');
$('#cfl').onclick=e=>{const b=e.target.closest('button');if(!b)return;cf=b.dataset.f;[...$('#cfl').children].forEach(x=>x.classList.toggle('on2',x===b))};
$('#cmu').onclick=e=>{const b=e.target.closest('button');if(!b)return;cmu=b.dataset.m;[...$('#cmu').children].forEach(x=>x.classList.toggle('on2',x===b))};
$('#mb').onclick=()=>{const t=$('#mt').value.trim();if(!t)return toast('Əvvəlcə bir şey yaz');P.unshift({u:'sen',n:PR.name,cap:t,m:cmu+' — '+PR.name,s:pickS,l:0,c:[],f:0,fl:cf});$('#mt').value='';closeAll();mode='all';document.querySelector('.tabs button').click();toast('Paylaşıldı! 🎉')};
app();load();render();
</script></body></html>
